<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Architect — Space Mission Design Game</title>
<meta name="description" content="Design, launch and operate a complete space mission. NASA Space Apps Challenge 2026 — Space Mission Design Game.">
<meta name="generator" content="Code drafted with AI assistance (Claude, Anthropic) and reviewed by the team">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#070b16; --bg2:#0d1426; --panel:#111a30; --panel2:#16213c; --line:#24304d; --text:#e6ebf5; --muted:#8f9bb5;
  --accent:#ffb547; --accent2:#5ce1e6; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --radius:14px;
  --font:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
body{background:
  radial-gradient(1200px 600px at 80% -10%,rgba(92,225,230,.08),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(255,181,71,.07),transparent 60%),var(--bg);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:
  radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe,transparent),
  radial-gradient(1px 1px at 200px 160px,#fff,transparent),radial-gradient(1.5px 1.5px at 330px 50px,#fff,transparent),
  radial-gradient(1px 1px at 400px 220px,#ddf,transparent);background-size:450px 260px}
#app{position:relative;z-index:1}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
h2{font-size:1.6rem} h3{font-size:1.1rem;letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:.82rem} .right{text-align:right} .center{justify-content:center}
.ok{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
code{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:5px}

/* buttons */
.btn{font:inherit;cursor:pointer;border-radius:10px;padding:.55em 1em;border:1px solid var(--line);background:var(--panel);color:var(--text);transition:.15s;font-weight:500}
.btn:hover:not([disabled]){border-color:#3a4a72;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#ffb547,#ff8a3d);border-color:transparent;color:#1a0f00;font-weight:700}
.btn.ghost{background:transparent}
.btn.go{background:rgba(74,222,128,.15);border-color:var(--good);color:var(--good)}
.btn.link{background:none;border:none;color:var(--accent2);padding:.3em .4em}
.btn.big{padding:.8em 1.4em;font-size:1.05rem} .btn.huge{padding:1em 2em;font-size:1.25rem;margin-top:12px}
.btn.small{padding:.3em .7em;font-size:.82rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.cta.small{margin-top:0}

/* home */
.home{max-width:1180px;margin:0 auto;padding:48px 24px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:62vh}
.kicker{font-family:var(--mono);font-size:.78rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.12em}
.hero h1{font-size:clamp(3rem,8vw,6rem);font-weight:700;letter-spacing:-.03em;margin:.15em 0}
.hero h1 span{background:linear-gradient(90deg,#ffb547,#ff6b6b 50%,#9b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.15rem;color:#c3cce0;max-width:560px}
.hero-art svg{width:100%;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px}
.feat span{color:var(--muted);font-size:.9rem}

/* pages */
.page{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
.page.narrow{max-width:900px}
.back{margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.lbl{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px}
.input{font:inherit;width:100%;padding:.6em .8em;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--text)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segbtn{font:inherit;cursor:pointer;padding:.5em 1em;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text)}
.segbtn.on{border-color:var(--accent);background:rgba(255,181,71,.12);color:var(--accent)}
.players{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.playerrow{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.rolechip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 8px;border-radius:999px;border:1px solid var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 10%,transparent);white-space:nowrap}
.rolegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rolecard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--rc);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px}
.rolecard .ri{font-size:1.6rem} .rolecard small{color:var(--muted)} .rolecard .goal{color:#c9d3e8}
.diffgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.diff{font:inherit;text-align:left;cursor:pointer;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);display:flex;flex-direction:column;gap:4px}
.diff small{color:var(--muted)} .diff.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* scenarios */
.scgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.sccard{font:inherit;text-align:left;color:var(--text);cursor:pointer;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:.2s;position:relative;overflow:hidden}
.sccard:hover{border-color:var(--accent);transform:translateY(-3px)}
.scicon{font-size:2.4rem}
.sctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sctop b{font-size:1.2rem}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.sccard p{margin:0;color:#c3cce0;font-size:.92rem}
.scmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.scobj{font-size:.85rem;border-top:1px dashed var(--line);padding-top:8px}

/* design workspace */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 18px;background:rgba(7,11,22,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-title{flex:1;font-size:1.02rem}
.tb-team{display:flex;gap:6px;flex-wrap:wrap}
.pchip{font-size:.8rem;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.workspace{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:18px;padding:18px;max-width:1600px;margin:0 auto}
.steps{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:6px}
.navstep{font:inherit;color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;background:transparent}
.navstep:hover{background:var(--panel)}
.navstep.on{background:var(--panel2);border-color:var(--line)}
.navstep .num{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;background:var(--bg2);border:1px solid var(--line)}
.navstep.st-done .num{background:rgba(74,222,128,.15);border-color:var(--good);color:var(--good)}
.navstep.st-issue .num{background:rgba(248,113,113,.15);border-color:var(--bad);color:var(--bad)}
.navstep .nt{display:flex;flex-direction:column} .navstep small{color:var(--muted);font-size:.74rem}
.navfoot{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.main{min-width:0}
.side{position:sticky;top:70px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;max-height:calc(100vh - 88px);overflow:auto}
.crafthold{background:radial-gradient(circle at 50% 40%,#16224a,#0a1024 70%);border-radius:12px;border:1px solid var(--line)}
.crafthold svg,.craft{width:100%;display:block}
.float{animation:float 6s ease-in-out infinite;transform-origin:center}
.craft-empty{opacity:.35}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.6deg)}}
.scimeter{margin:12px 0 6px}
.scimeter>div:first-child{display:flex;justify-content:space-between;align-items:baseline}
.scimeter b{font-size:1.4rem}
.gauges{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.gauge .gl{display:flex;justify-content:space-between;font-size:.8rem;gap:8px}
.gauge .gl b{font-family:var(--mono);font-weight:500;font-size:.76rem;text-align:right}
.gb{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:3px;position:relative}
.gb.big{height:12px}
.gb i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .4s}
.gauge.warn .gb i,.gb i.warn{background:var(--warn)} .gauge.bad .gb i,.gb i.bad{background:var(--bad)} .gb i.ok{background:var(--good)}
.gauge.bad .gl b{color:var(--bad)} .gauge.warn .gl b{color:var(--warn)}
.gauge.na .gb i{background:#3a4a72} .gauge.na{opacity:.6}
.tgt{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.8}
.issues{margin-top:12px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

.turn{border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 10%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.hint{border:1px dashed var(--accent2);background:rgba(92,225,230,.07);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}
.sect{margin-bottom:26px}
.sect .intro{color:#b8c2d8;margin:-.2em 0 .9em;font-size:.93rem}
.sect.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.opt{font:inherit;color:var(--text);text-align:left;cursor:pointer;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 13px 12px;display:flex;flex-direction:column;gap:7px;transition:.15s}
.opt:hover{border-color:#3a4a72;background:var(--panel2)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:linear-gradient(160deg,rgba(255,181,71,.10),var(--panel))}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding-right:22px}
.opt-h b{font-size:.98rem}
.opt .ex{font-size:.78rem;color:var(--muted);margin-top:-4px}
.stats{display:flex;flex-wrap:wrap;gap:5px}
.stats span{font-family:var(--mono);font-size:.72rem;padding:2px 6px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:#c9d3e8}
.learn{font-size:.82rem;color:var(--muted)}
.check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:#1a0f00}
.opt.on .check{background:var(--accent);border-color:var(--accent)}
.badge{font-size:.68rem;padding:2px 7px;border-radius:999px;white-space:nowrap;font-weight:600}
.badge.good{background:rgba(74,222,128,.15);color:var(--good)} .badge.ok{background:rgba(92,225,230,.15);color:var(--accent2)}
.badge.warn{background:rgba(251,191,36,.15);color:var(--warn)} .badge.bad{background:rgba(248,113,113,.15);color:var(--bad)} .badge.dim{background:var(--bg2);color:var(--muted)}
.stars{color:var(--accent);font-size:.8rem;letter-spacing:1px;white-space:nowrap}
.goalbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:.88rem}
.gpill{padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.gpill.ok{border-color:var(--good);color:var(--good)}
.stepnav{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

.brief{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:24px}
.briefhead{display:flex;gap:14px;align-items:center}.bigicon{font-size:2.8rem}
.objectives{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.obj{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.obj span{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.1em}
.obj.primary{border-color:var(--accent)} .obj.primary span{color:var(--accent)}
.obj small{color:var(--muted)}
.slider{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.slider input{flex:1;min-width:200px;accent-color:var(--accent)}
.slider b{font-size:1.2rem;min-width:80px}
.orbitview{background:radial-gradient(circle at 50% 50%,#101a3a,#070b16);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
.orbitsvg{width:100%;display:block;max-height:260px}
.databox{display:grid;grid-template-columns:auto auto 1fr;gap:6px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:20px}
.databox small{display:block;color:var(--muted);font-size:.75rem}
.databox b{font-family:var(--mono);font-size:.9rem}
.databox .arrow{font-size:1.4rem;color:var(--muted)}
.databox .bar,.databox .muted{grid-column:1/-1}
.databox .bar{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;position:relative}
.databox .bar:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;opacity:.6}
.databox .bar i{display:block;height:100%}.databox .bar i.ok{background:var(--good)}.databox .bar i.warn{background:var(--warn)}.databox .bar i.bad{background:var(--bad)}
.massbox{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;flex-wrap:wrap}
.massbox small{display:block;color:var(--muted);font-size:.75rem}.massbox b{font-family:var(--mono);font-size:1.1rem}

/* review */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.sum small,.sum span{color:var(--muted);font-size:.78rem}.sum b{font-size:1.4rem}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:.9rem}
.chk small{display:block;color:var(--muted);margin-top:3px}
.chk.st-block{border-color:var(--bad);background:rgba(248,113,113,.06)}
.chk.st-fail{border-color:rgba(248,113,113,.6)}
.chk.st-warn{border-color:rgba(251,191,36,.45)}
.chk .owner{margin-left:6px}
.ci{font-size:1.05rem}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.goalrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.goalrow b{color:var(--muted);font-size:.8rem}.goalrow.met b{color:var(--good)}
.launchpad{background:linear-gradient(160deg,rgba(255,181,71,.07),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.signrow{display:flex;justify-content:center;align-items:center;gap:16px;margin:6px 0}
.signrow span{min-width:180px;text-align:right}
.override{display:block;margin:12px auto 0;color:var(--warn);font-size:.9rem}

/* sim */
.simwrap{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;padding:18px;max-width:1400px;margin:0 auto}
.simview{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.simscene{background:radial-gradient(circle at 50% 50%,#101a3a,#05080f);border-radius:14px;min-height:300px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.simscene .orbitsvg{max-height:none}
.launchscene{position:relative;height:300px;width:100%;display:grid;place-items:center}
.rocket{height:220px;animation:lift 3s ease-in forwards}
.pad{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(#2a3248,#151b2b)}
@keyframes lift{0%{transform:translateY(40px)}15%{transform:translateY(36px)}100%{transform:translateY(-420px)}}
.simstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.simstats>div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.simstats small{display:block;color:var(--muted);font-size:.75rem}.simstats b{font-family:var(--mono);font-size:.95rem}
.simctrl{display:flex;gap:6px;flex-wrap:wrap}
.simlog{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;max-height:calc(100vh - 110px);overflow:auto}
.logi{display:grid;grid-template-columns:40px 1fr;gap:8px;font-size:.86rem;padding:6px 0;border-bottom:1px solid rgba(36,48,77,.6)}
.logi span{font-family:var(--mono);color:var(--muted);font-size:.74rem;padding-top:2px}
.logi.good{color:#b8f5cc}.logi.bad{color:#ffb4b4}.logi.warn{color:#ffe29a}.logi.event{color:#bfe9ff}.logi.phase{color:var(--accent);font-weight:600}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;max-width:680px;width:100%;max-height:88vh;overflow:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .x{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
.evicon{font-size:2.6rem}
.modal .learn{background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:.88rem;color:#c3cce0}
.choices{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.choice{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.choice small{grid-column:1;color:var(--muted)} .choice .btn{grid-row:1/3;grid-column:2}
.choice.dis{opacity:.5}
.votes{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.voterow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.voterow>div{display:flex;gap:4px;flex-wrap:wrap}
.tally{display:flex;gap:14px;margin:10px 0;font-size:.85rem;color:var(--muted)}
.result{font-size:1.05rem;background:var(--bg2);padding:14px;border-radius:12px;border-left:3px solid var(--accent)}
.howto li{margin-bottom:8px}
.glossary dt{font-weight:700;margin-top:10px;color:var(--accent2)} .glossary dd{margin:2px 0 0;color:#c3cce0;font-size:.92rem}
textarea.code{width:100%;min-height:90px;font-family:var(--mono);font-size:.78rem;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;word-break:break-all}
.lb td:last-child{text-align:right}

/* report */
.banner{display:flex;justify-content:space-between;align-items:center;gap:20px;border-radius:20px;padding:24px 28px;border:1px solid var(--line);margin-bottom:18px}
.banner.good{background:linear-gradient(135deg,rgba(74,222,128,.18),var(--panel))}
.banner.warn{background:linear-gradient(135deg,rgba(251,191,36,.16),var(--panel))}
.banner.bad{background:linear-gradient(135deg,rgba(248,113,113,.18),var(--panel))}
.banner h1{font-size:2.4rem}
.scorebox{text-align:center;min-width:140px}
.scorebox .stars{font-size:2rem}.scorebox b{display:block;font-size:2.4rem;font-family:var(--mono)}
.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.reportgrid .card{margin:0}.reportgrid .wide{grid-column:1/-1}
.lessons{padding-left:18px;margin:0}.lessons li{margin-bottom:8px}
.lessons li.good::marker{content:"✓  ";color:var(--good)}.lessons li.warn::marker{content:"!  ";color:var(--warn)}.lessons li.bad::marker{content:"✗  ";color:var(--bad)}
.miniscroll{max-height:320px;overflow:auto}
.decisions{padding-left:18px}.decisions li{margin-bottom:8px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.specs div{background:var(--bg2);border-radius:10px;padding:8px 10px}.specs small{display:block;color:var(--muted);font-size:.75rem}

@media (max-width:1180px){
  .workspace{grid-template-columns:200px minmax(0,1fr)}
  .side{grid-column:1/-1;position:static;max-height:none;order:-1;display:grid;grid-template-columns:260px 1fr;gap:14px}
  .side .scimeter,.side .gauges,.side .issues{grid-column:2}
  .side .crafthold{grid-row:1/4}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}.features,.rolegrid{grid-template-columns:1fr 1fr}
  .scgrid,.diffgrid{grid-template-columns:1fr}
  .workspace{grid-template-columns:1fr;padding:10px}
  .steps{position:static;flex-direction:row;overflow-x:auto}
  .navstep{flex:0 0 auto}.navstep .nt small,.navfoot{display:none}
  .side .crafthold{display:none}
  .side{grid-template-columns:1fr}.side .scimeter,.side .gauges,.side .issues,.side .crafthold{grid-column:1;grid-row:auto}
  .sect.two,.reportgrid,.simwrap{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr 1fr}
  .playerrow{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}.tb-team{display:none}
  .banner{flex-direction:column;text-align:center}
  .specs{grid-template-columns:1fr 1fr}
}

.footnote{text-align:center;margin-top:28px}
</style>

    { id: 'rad_mon', name: 'Radiation monitor', mass: 2, power: 3, cost: 1, data: 0.1, value: 8, pointing: 30, trl: 9,
      learn: 'Small detector measuring the local radiation environment — useful for future astronauts.' },
    { id: 'cube_cam', name: 'CubeSat camera', mass: 1, power: 5, cost: 0.5, data: 2, value: 6, pointing: 2, trl: 9,
      learn: 'Tiny off-the-shelf camera. Low resolution, but great for outreach pictures.' },
  ];

  // ---------- SCENARIOS ----------
  const SCENARIOS = [
    { id: 'wildfire', name: 'Wildfire Watch', body: 'Earth', level: 'Beginner', budget: 120, years: 3, icon: '🔥',
      blurb: 'Wildfires are growing more frequent. Build a satellite that spots fires every day and maps the damage they leave.',
      orbitFit: { sso: 1, leo: 0.85, geo: 0.6 },
      instFit: { thermal_ir: 1, multispectral: 1, hyperspectral: 0.8, highres: 0.6, sar: 0.7, cube_cam: 0.5, lidar_alt: 0.3, rad_mon: 0.1 },
      primary: { text: 'Detect active fires every day', anyOf: ['thermal_ir'], why: 'Fires are hot — a thermal infrared camera sees them even through thin smoke.' },
      secondary: [
        { text: 'Map burn scars and vegetation recovery', anyOf: ['multispectral', 'hyperspectral', 'highres'] },
        { text: 'See through thick smoke and clouds', anyOf: ['sar'] },
      ],
      sciTarget: 45,
      real: 'NASA\'s MODIS (Terra & Aqua) and VIIRS instruments detect active fires daily from polar orbits; Landsat maps burn scars; ECOSTRESS measures heat from the ISS.' },
    { id: 'lunar', name: 'Lunar Ice Hunter', body: 'Moon', level: 'Intermediate', budget: 250, years: 2, icon: '🌙',
      blurb: 'Future astronauts need water. Find ice hidden in the permanently shadowed craters at the Moon\'s poles and map safe landing zones.',
      orbitFit: { moon: 1 },
      instFit: { neutron: 1, sar: 1, lidar_alt: 1, multispectral: 0.8, thermal_ir: 0.8, hyperspectral: 0.9, highres: 0.7, cube_cam: 0.5, rad_mon: 0.4, magnetometer: 0.2 },
      primary: { text: 'Detect water ice in polar craters', anyOf: ['neutron', 'sar', 'hyperspectral'], why: 'Neutron spectrometers sense hydrogen; radar and spectrometers can spot ice signatures.' },
      secondary: [
        { text: 'Map polar terrain for future landings', anyOf: ['lidar_alt', 'highres'] },
        { text: 'Measure how cold the crater floors are', anyOf: ['thermal_ir'] },
      ],
      sciTarget: 60,
      real: 'Lunar Prospector (1998) found hydrogen at the poles with a neutron spectrometer; LRO\'s LOLA altimeter and Diviner radiometer mapped polar terrain and cold traps; India\'s Chandrayaan-1 carried NASA\'s M3 spectrometer, which detected water.' },
    { id: 'solar', name: 'Solar Storm Sentinel', body: 'Sun–Earth L1', level: 'Intermediate', budget: 250, years: 5, icon: '☀️',
      blurb: 'Solar storms can knock out power grids and satellites. Station an early-warning sentinel between the Sun and Earth.',
      orbitFit: { l1: 1, l2: 0.3, geo: 0.35, sso: 0.25, leo: 0.2 },
      instFit: { plasma: 1, magnetometer: 1, coronagraph: 1, euv: 1, rad_mon: 0.6, cube_cam: 0.1 },
      primary: { text: 'Measure the incoming solar wind and its magnetic field', allOf: ['plasma', 'magnetometer'], why: 'Forecasters need both the particle stream and its magnetic direction to predict storm strength.' },
      secondary: [
        { text: 'Watch eruptions (CMEs) leave the Sun', anyOf: ['coronagraph'] },
        { text: 'Image solar flares as they happen', anyOf: ['euv'] },
      ],
      sciTarget: 60,
      real: 'ACE, SOHO and DSCOVR watch the solar wind from L1; NOAA\'s SWFO-L1 continues the job. SOHO\'s coronagraph has tracked thousands of CMEs.' },
    { id: 'mars', name: 'Red Planet Recon', body: 'Mars', level: 'Advanced', budget: 850, years: 4, icon: '🔴',
      blurb: 'Where did Mars\' water go? Map minerals that only form in water, scout landing sites, and hunt for buried ice.',
      orbitFit: { mars: 1 },
      instFit: { hyperspectral: 1, highres: 1, sar: 1, multispectral: 0.8, thermal_ir: 0.8, neutron: 0.8, lidar_alt: 0.7, magnetometer: 0.5, rad_mon: 0.5, cube_cam: 0.4 },
      primary: { text: 'Map minerals formed in water', anyOf: ['hyperspectral'], why: 'Clays and salts have unique colour fingerprints only an imaging spectrometer can resolve.' },
      secondary: [
        { text: 'Photograph candidate landing sites in detail', anyOf: ['highres'] },
        { text: 'Detect underground ice', anyOf: ['sar', 'neutron'] },
      ],
      sciTarget: 80,
      real: 'Mars Reconnaissance Orbiter carries HiRISE (high-res camera), CRISM (imaging spectrometer) and SHARAD (radar sounder); Mars Odyssey\'s neutron spectrometer found ground ice.' },
    { id: 'cosmic', name: 'Cosmic Dawn Observatory', body: 'Sun–Earth L2', level: 'Expert', budget: 1800, years: 5, icon: '🔭',
      blurb: 'See the first galaxies forming after the Big Bang. Build a cold infrared observatory far from Earth\'s heat.',
      orbitFit: { l2: 1, l1: 0.5, geo: 0.3, sso: 0.3, leo: 0.25 },
      instFit: { ir_tel: 1, nir_spec: 1, rad_mon: 0.2, cube_cam: 0.05 },
      primary: { text: 'Image the earliest galaxies in infrared', anyOf: ['ir_tel'], why: 'Light from the first galaxies is stretched into the infrared by the expansion of the Universe.' },
      secondary: [
        { text: 'Measure galaxy spectra to date them', anyOf: ['nir_spec'] },
      ],
      sciTarget: 120,
      real: 'The James Webb Space Telescope orbits L2 behind a five-layer sunshield, downlinking ~57 GB per day over Ka-band through the Deep Space Network.' },
    { id: 'sandbox', name: 'Sandbox', body: 'Anywhere', level: 'Free play', budget: 5000, years: 3, icon: '🧪', sandbox: true,
      blurb: 'No mission goal, no real budget pressure. Try anything and see what the physics says.',
      orbitFit: { leo: 1, sso: 1, geo: 1, l1: 1, l2: 1, moon: 1, mars: 1 },
      instFit: Object.fromEntries(['thermal_ir','multispectral','hyperspectral','highres','sar','neutron','lidar_alt','magnetometer','plasma','coronagraph','euv','ir_tel','nir_spec','rad_mon','cube_cam'].map(i => [i, 1])),
      primary: { text: 'Return any science data', anyOf: ['thermal_ir','multispectral','hyperspectral','highres','sar','neutron','lidar_alt','magnetometer','plasma','coronagraph','euv','ir_tel','nir_spec','rad_mon','cube_cam'], why: 'Anything goes!' },
      secondary: [],
      sciTarget: 60,
      real: 'Every real mission started as a sandbox sketch like this one.' },
  ];

  const byId = (arr, id) => arr.find(x => x.id === id) || null;
  const get = {
    orbit: id => byId(ORBITS, id), launcher: id => byId(LAUNCHERS, id), bus: id => byId(BUSES, id),
    power: id => byId(POWER, id), battery: id => byId(BATTERIES, id), comms: id => byId(COMMS, id),
    ground: id => byId(GROUND, id), adcs: id => byId(ADCS, id), computer: id => byId(COMPUTERS, id),
    propulsion: id => byId(PROPULSION, id), thermal: id => byId(THERMAL, id), risk: id => byId(RISK, id),
    inst: id => byId(INSTRUMENTS, id), scenario: id => byId(SCENARIOS, id), difficulty: id => DIFFICULTY[id],
  };

  function newDesign(scenarioId, difficultyId) {
    const sc = get.scenario(scenarioId);
    return {
      scenario: scenarioId, difficulty: difficultyId || 'engineer', years: sc ? sc.years : 3, risk: 'C',
      orbit: null, ground: null, comms: null, instruments: [],
      bus: null, power: null, battery: null, adcs: null, computer: null, propulsion: null, thermal: null,
      launcher: null,
    };
  }

  // Which choice-fields belong to which role (for ownership/sign-off)
  const FIELD_ROLE = {
    years: 'director', risk: 'director', launcher: 'director',
    orbit: 'flightops', ground: 'flightops', comms: 'flightops',
    instruments: 'science',
    bus: 'engineer', power: 'engineer', battery: 'engineer', adcs: 'engineer', computer: 'engineer', propulsion: 'engineer', thermal: 'engineer',
  };
  const REQUIRED_FIELDS = ['orbit', 'ground', 'comms', 'bus', 'power', 'battery', 'adcs', 'computer', 'propulsion', 'thermal', 'launcher'];

  const round = (x, n = 1) => { const p = Math.pow(10, n); return Math.round(x * p) / p; };

  // ======================================================================
  //  ENGINEERING MODEL
  // ======================================================================
  function analyze(d) {
    const sc = get.scenario(d.scenario);
    const diff = get.difficulty(d.difficulty) || DIFFICULTY.engineer;
    const orbit = get.orbit(d.orbit), bus = get.bus(d.bus), pw = get.power(d.power), bat = get.battery(d.battery);
    const comms = get.comms(d.comms), ground = get.ground(d.ground), adcs = get.adcs(d.adcs), comp = get.computer(d.computer);
    const prop = get.propulsion(d.propulsion), therm = get.thermal(d.thermal), lv = get.launcher(d.launcher);
    const risk = get.risk(d.risk) || RISK[1];
    const insts = (d.instruments || []).map(get.inst).filter(Boolean);
    const years = Math.max(1, d.years || 1);

    const mm = bus ? bus.massMult : 1, pm = bus ? bus.powerMult : 1, cm = bus ? bus.costMult : 1;
    const missing = REQUIRED_FIELDS.filter(f => !d[f]);
    if (!insts.length) missing.push('instruments');

    // ---- POWER ----
    const instPower = insts.reduce((s, i) => s + i.power, 0);
    const parts = {
      bus: bus ? bus.basePower : 0, instruments: instPower, comms: comms ? comms.power : 0,
      adcs: adcs ? adcs.power * pm : 0, computer: comp ? comp.power : 0,
    };
    let load = Object.values(parts).reduce((a, b) => a + b, 0);
    let thermalPower = 0;
    if (therm) thermalPower = load * therm.powerFrac + therm.power;
    parts.thermal = thermalPower;
    load += thermalPower;

    const eclipse = orbit ? orbit.eclipseMin : 0, period = orbit ? orbit.periodMin : 1;
    const solarFactor = orbit ? orbit.solar : 1;
    let required = load, availBOL = 0, availEOL = 0;
    if (pw && pw.type === 'solar') {
      // array must run the load in sunlight AND recharge what the battery spent in eclipse
      required = eclipse > 0 ? load * (1 + (eclipse / (period - eclipse)) / CHARGE_EFF) : load;
      availBOL = pw.watts * solarFactor;
      availEOL = availBOL * Math.max(0, 1 - SOLAR_DEGRADE * years);
    } else if (pw && pw.type === 'rtg') {
      required = load;
      availBOL = pw.watts;
      availEOL = pw.watts * Math.max(0, 1 - RTG_DEGRADE * years);
    }
    const powerMargin = required > 0 ? (availEOL - required) / required : 0;

    // ---- BATTERY ----
    const dod = orbit ? orbit.dod : 0.5;
    let batteryNeed = (bus ? bus.basePower : 0) * 1.0 / 0.7; // survive launch / safe mode for 1 h
    if (pw && pw.type === 'solar' && eclipse > 0) batteryNeed = Math.max(batteryNeed, load * (eclipse / 60) / dod);
    if (pw && pw.type === 'rtg') batteryNeed = Math.max(batteryNeed, load * 0.5 / dod); // peaks
    const batteryWh = bat ? bat.wh : 0;

    // ---- DELTA-V & MASS ----
    const dvNeedFull = orbit ? orbit.dvInsert + orbit.dvYear * years + orbit.dvDispose : 0;
    const instMass = insts.reduce((s, i) => s + i.mass, 0);
    let dryCore = (bus ? bus.mass : 0) + instMass + (pw ? pw.mass : 0) + (bat ? bat.mass : 0) + (comms ? comms.mass : 0)
      + (adcs ? adcs.mass * mm : 0) + (comp ? comp.mass : 0) + (prop ? prop.dry * mm : 0) + (therm ? therm.mass : 0);
    const thermalMass = therm ? dryCore * therm.massFrac : 0;
    const dryMass = (dryCore + thermalMass) * risk.massMult;
    let dvCap = 0, propMass = 0;
    if (prop && prop.id !== 'none' && dvNeedFull > 0) {
      const dvLoad = Math.min(dvNeedFull * 1.1, prop.maxDv); // 10% margin, limited by tank size
      propMass = dryMass * (Math.exp(dvLoad / (prop.isp * G0)) - 1);
      dvCap = dvLoad;
    } else if (prop && prop.id !== 'none') {
      dvCap = 0; propMass = 0;
    }
    const wetMass = dryMass + propMass;
    const lvCap = lv && orbit ? (lv.cap[orbit.id] || 0) : 0;
    const massMargin = lvCap > 0 ? (lvCap - wetMass) / lvCap : -1;

    // ---- DATA ----
    const reduction = comp ? comp.reduction : 1;
    const dataGen = insts.reduce((s, i) => s + i.data, 0) * reduction; // Gb/day
    const rate = comms && orbit ? comms.rate[orbit.dist] : 0;
    const hours = ground && orbit ? ground.hours[orbit.dist] : 0;
    const dataDown = rate * hours * 3.6; // Mbps * h * 3600 s / 1000 = Gb/day
    const dataRatio = dataGen > 0 ? dataDown / dataGen : (dataDown > 0 ? 9.99 : 0);

    // ---- POINTING ----
    const pointNeed = Math.min(30, ...insts.map(i => i.pointing), comms ? comms.pointing : 30);
    const pointHave = adcs ? adcs.pointing : 99;

    // ---- COST ($M) ----
    const cost = {
      bus: bus ? bus.cost : 0, instruments: insts.reduce((s, i) => s + i.cost, 0), power: pw ? pw.cost : 0,
      battery: bat ? bat.cost : 0, comms: comms ? comms.cost : 0, adcs: adcs ? adcs.cost * cm : 0,
      computer: comp ? comp.cost : 0, propulsion: prop ? prop.cost * cm : 0,
      thermal: therm ? (therm.id === 'cryo' ? therm.cost : therm.cost * cm) : 0,
    };
    const hardware = Object.values(cost).reduce((a, b) => a + b, 0);
    const integration = hardware * 0.15;
    const riskPremium = (hardware + integration) * (risk.costMult - 1);
    const development = hardware + integration + riskPremium;
    const launch = lv ? lv.cost : 0;
    const opsYear = (bus ? bus.opsYear : 0) + (ground ? ground.costYear : 0);
    const operations = opsYear * years;
    const total = development + launch + operations;
    const budget = (sc ? sc.budget : 0) * diff.budgetMult;
    const reserve = budget - total;

    // ---- SCIENCE POTENTIAL ----
    const orbitFit = sc && orbit ? (sc.orbitFit[orbit.id] || 0) : 0;
    const hasCryo = therm && therm.id === 'cryo';
    const instIds = insts.map(i => i.id);
    const instScience = insts.map(i => {
      let fit = sc ? (sc.instFit[i.id] || 0) : 0;
      let notes = [];
      if (i.requires && !instIds.includes(i.requires)) { fit *= 0.1; notes.push('needs ' + get.inst(i.requires).name); }
      let f = 1;
      if (i.needsCryo && !hasCryo) { f *= 0.05; notes.push('blinded by heat (no cryo)'); }
      if (adcs && adcs.pointing > i.pointing) { f *= 0.3; notes.push('pointing too coarse'); }
      return { id: i.id, name: i.name, fit, factor: f, value: i.value * fit * f, notes };
    });
    const rawScience = instScience.reduce((s, x) => s + x.value, 0);
    // until a subsystem is chosen, preview science as if it were adequate
    const dataFactor = (!comms || !ground || !orbit) ? 1 : Math.min(1, Math.pow(Math.max(0, dataRatio), 0.7));
    const powerFactor = (!pw || !orbit) ? 1 : (availEOL > 0 && required > 0 ? Math.min(1, availEOL / required) : 0);
    const sciencePerYear = rawScience * orbitFit * dataFactor * powerFactor; // "science points" at full health over nominal mission
    const sciencePotential = sc ? sciencePerYear / sc.sciTarget : 0; // 1.0 = target met over nominal life

    // ---- CHECKS ----
    const checks = [];
    const add = (id, role, status, label, msg, why) => checks.push({ id, role, status, label, msg, why });

    if (missing.length) add('missing', 'director', 'block', 'Design incomplete',
      'Still to choose: ' + missing.map(f => FIELD_LABEL[f] || f).join(', ') + '.', 'Every subsystem needs a decision before launch.');

    // Budget
    if (sc) {
      if (reserve < 0 && !sc.sandbox) add('budget', 'director', 'block', 'Over budget',
        `Mission costs $${round(total)}M but only $${round(budget)}M is available.`, 'No agency funds a mission that is over budget. Cheaper launch, fewer instruments, a lower risk class or a shorter mission all reduce cost.');
      else if (!sc.sandbox && reserve / budget < 0.1) add('budget', 'director', 'warn', 'Thin budget reserve',
        `Only $${round(reserve)}M (${Math.round(reserve / budget * 100)}%) in reserve.`, 'Real projects keep 10–30% reserve for surprises. Events during the mission may need money.');
      else add('budget', 'director', 'ok', 'Budget', `$${round(total)}M of $${round(budget)}M — $${round(reserve)}M reserve.`, '');
    }

    // Launch vehicle
    if (lv && orbit) {
      if (!lvCap) add('lv_reach', 'director', 'block', 'Rocket can\'t reach this orbit',
        `${lv.name} cannot deliver payloads to ${orbit.name}.`, 'Different destinations need different energy. Pick a bigger launcher.');
      else if (wetMass > lvCap) add('lv_mass', 'director', 'block', 'Too heavy for the rocket',
        `Spacecraft ${Math.round(wetMass)} kg vs. capacity ${lvCap} kg to ${orbit.short.split(' ·')[0]}.`, 'Every kilogram must be lifted. Reduce mass (smaller bus, lighter instruments, more efficient propulsion) or choose a bigger rocket.');
      else if (massMargin < 0.1) add('lv_mass', 'director', 'warn', 'Low launch-mass margin',
        `${Math.round(wetMass)} kg of ${lvCap} kg (${Math.round(massMargin * 100)}% margin).`, 'Spacecraft almost always gain weight during development. Engineers like 10–20% margin.');
      else add('lv_mass', 'director', 'ok', 'Launch mass', `${Math.round(wetMass)} kg of ${lvCap} kg (${Math.round(massMargin * 100)}% margin).`, '');
      if (lv.maxBus && bus && BUSES.findIndex(b => b.id === bus.id) > BUSES.findIndex(b => b.id === lv.maxBus))
        add('lv_bus', 'director', 'block', 'Spacecraft too big for this rocket',
          `${lv.name} only fits up to a ${get.bus(lv.maxBus).name}.`, 'Rideshare and small rockets have small payload fairings.');
    }

    // Orbit suits scenario
    if (sc && orbit && !sc.sandbox) {
      if (orbitFit === 0) add('orbit_fit', 'flightops', 'block', 'Wrong destination',
        `${orbit.name} can't accomplish "${sc.primary.text}".`, `This mission's target is ${sc.body}.`);
      else if (orbitFit < 0.7) add('orbit_fit', 'flightops', 'warn', 'Poor vantage point',
        `${orbit.name} only gives ${Math.round(orbitFit * 100)}% of the ideal science for this mission.`, 'Where you observe from matters as much as what you carry.');
    }

    // Payload accommodation
    if (bus) {
      if (instMass > bus.payloadMass) add('payload_mass', 'engineer', 'block', 'Instruments too heavy for the bus',
        `${Math.round(instMass)} kg of instruments; ${bus.name} supports ${bus.payloadMass} kg.`, 'The bus structure is designed around a maximum payload.');
      if (insts.length > bus.slots) add('payload_slots', 'engineer', 'block', 'Not enough instrument slots',
        `${insts.length} instruments; ${bus.name} has ${bus.slots} mounting slots.`, 'Each instrument needs space, a clear field of view and connections.');
      if (pw && pw.tier > bus.maxPowerTier && pw.type === 'solar') add('power_fit', 'engineer', 'block', 'Solar array too large for bus',
        `${bus.name} can't carry ${pw.name}.`, 'Bigger arrays need a stronger structure and drive motors.');
      if (pw && pw.type === 'rtg' && !bus.rtgOk) add('power_fit', 'engineer', 'block', 'RTG needs a bigger bus', 'Only Medium or Flagship spacecraft can host an RTG.', 'RTGs are heavy and hot.');
    }

    // Power
    if (pw && orbit) {
      if (powerMargin < 0) add('power', 'engineer', 'fail', 'Power deficit',
        `Need ${Math.round(required)} W, end-of-life supply ${Math.round(availEOL)} W.`,
        (eclipse > 0 ? `In this orbit the arrays must also recharge the battery after ${eclipse} min of shadow each orbit. ` : '') +
        (solarFactor < 1 ? `Sunlight here is only ${Math.round(solarFactor * 100)}% of Earth's. ` : '') +
        'Instruments will have to take turns (duty-cycling), cutting science.');
      else if (powerMargin < 0.15) add('power', 'engineer', 'warn', 'Low power margin',
        `${Math.round(powerMargin * 100)}% margin (${Math.round(availEOL)} W vs ${Math.round(required)} W needed).`, 'Solar cells degrade ~2.5% per year in space. A micrometeoroid hit could push you into deficit.');
      else add('power', 'engineer', 'ok', 'Power', `${Math.round(availEOL)} W supply vs ${Math.round(required)} W needed (${Math.round(powerMargin * 100)}% margin).`, '');
      if (prop && prop.power > 0 && availBOL < prop.power) add('ion_power', 'engineer', 'fail', 'Not enough power for ion engine',
        `Ion thrusters need ${prop.power} W; arrays give ${Math.round(availBOL)} W.`, 'Electric propulsion trades propellant for electricity.');
    }
    // Battery
    if (bat && orbit) {
      if (batteryWh < batteryNeed) add('battery', 'engineer', 'fail', 'Battery too small',
        `Need ${Math.round(batteryNeed)} Wh usable-equivalent, have ${batteryWh} Wh.`,
        eclipse > 0 ? `Each orbit has ${eclipse} min of darkness. Batteries may only be drained to ${Math.round(dod * 100)}% depth or they wear out fast over thousands of cycles.` : 'The battery must carry the spacecraft through launch and safe mode.');
      else add('battery', 'engineer', 'ok', 'Battery', `${batteryWh} Wh vs ${Math.round(batteryNeed)} Wh needed.`, '');
    }
    // Delta-v
    if (prop && orbit) {
      const needCore = orbit.dvInsert + orbit.dvYear * years;
      if (orbit.dvInsert > 0 && dvCap < orbit.dvInsert) add('dv', 'engineer', 'fail', 'Can\'t brake into orbit',
        `Orbit insertion needs ${orbit.dvInsert} m/s; your propulsion provides ${Math.round(dvCap)} m/s.`, 'Without the capture burn the spacecraft flies right past its target. Choose a higher-performance engine.');
      else if (dvCap < needCore && orbit.stationKeepLimitsLife) add('dv', 'engineer', 'warn', 'Fuel runs out early',
        `Needs ${Math.round(needCore)} m/s for ${years} yr; carries ${Math.round(dvCap)} m/s.`, 'Station-keeping burns are needed every year to stay in this orbit. When fuel runs out, the mission ends.');
      else if (dvCap < needCore) add('dv', 'flightops', 'warn', 'No orbit maintenance',
        'Without orbit-trim fuel the ground track will drift (−10% science).', 'Small burns keep the orbit and imaging schedule predictable.');
      else add('dv', 'engineer', 'ok', 'Propulsion (Δv)', `${Math.round(dvCap)} m/s available vs ${Math.round(dvNeedFull)} m/s planned.`, '');
      if (orbit.dvDispose > 0 && dvCap < dvNeedFull) add('disposal', 'flightops', 'warn', 'No end-of-life disposal',
        `De-orbit / graveyard burn needs ${orbit.dvDispose} m/s more fuel.`, 'Space-debris rules require satellites to leave crowded orbits after their mission (within 5 years in the US). Dead satellites are collision hazards for everyone.');
      if (prop.slow && orbit.transitDays > 3) add('ion_slow', 'flightops', 'warn', 'Slow transfer',
        'Ion propulsion spirals out gently: transfer takes months longer.', 'Low thrust = long journey, but huge fuel savings.');
    }
    // Comms
    if (comms && ground && orbit) {
      if (rate === 0 || hours === 0) add('link', 'flightops', 'fail', 'No communication link',
        rate === 0 ? `${comms.name} is too weak to be heard from ${orbit.name}.` : `${ground.name} can't track a spacecraft at ${orbit.name}.`,
        'Signal strength falls with the square of distance. Deep-space missions need big antennas on both ends.');
      else if (dataRatio < 1) add('data', 'flightops', 'warn', 'Data bottleneck',
        `Instruments make ${round(dataGen)} Gb/day; you can downlink ${round(dataDown)} Gb/day (${Math.round(dataRatio * 100)}%).`, 'Data that can\'t be sent home is lost. Faster radio, more ground passes, or onboard processing all help.');
      else add('data', 'flightops', 'ok', 'Data downlink', `${round(dataDown)} Gb/day capacity vs ${round(dataGen)} Gb/day produced.`, '');
    }
    // Pointing
    if (adcs && orbit) {
      if (adcs.earthOnly && orbit.body !== 'earth') add('mtq', 'engineer', 'fail', 'Magnetorquers useless here',
        'There is no strong magnetic field to push against away from Earth.', 'Away from Earth you need reaction wheels or thrusters to point.');
      if (pointHave > pointNeed) add('pointing', 'engineer', 'warn', 'Pointing not precise enough',
        `Payload needs ${pointNeed}°; attitude control gives ${pointHave}°.`, 'Blurry images and a wobbling antenna beam. Affected instruments return ~30% of their science.');
      else if (insts.length) add('pointing', 'engineer', 'ok', 'Pointing', `${pointHave}° achieved vs ${pointNeed}° required.`, '');
    }
    // Radiation
    if (comp && orbit && comp.radTol < orbit.radiation) add('radiation', 'engineer', 'warn', 'Radiation risk',
      `${orbit.name} is a harsh radiation environment for a ${comp.name.toLowerCase()}.`, 'Energetic particles flip memory bits and can latch up chips. Expect resets and possible failure.');
    // Thermal
    if (therm && orbit && therm.level < orbit.thermal) add('thermal', 'engineer', 'warn', 'Thermal risk',
      `${orbit.name} has extreme temperature swings; passive thermal control is marginal.`, 'Electronics that get too hot or cold fail. Heaters and radiators keep them in range.');
    insts.filter(i => i.needsCryo).forEach(i => { if (!hasCryo) add('cryo_' + i.id, 'engineer', 'fail', 'Infrared instrument too warm',
      `${i.name} needs a sunshield + cryocooler.`, 'A warm infrared telescope glows in its own detectors, drowning the faint signal.'); });
    // Instrument relevance
    instScience.filter(x => x.fit === 0 && sc && !sc.sandbox).forEach(x => add('fit_' + x.id, 'science', 'warn', 'Instrument off-mission',
      `${x.name} adds nothing to this mission's goals.`, 'Every instrument costs mass, power and money. Carry only what the science needs.'));
    insts.filter(i => i.requires && !instIds.includes(i.requires)).forEach(i => add('req_' + i.id, 'science', 'fail', 'Missing companion instrument',
      `${i.name} needs the ${get.inst(i.requires).name}.`, 'Some instruments only work as part of a larger system.'));
    // Primary objective possible?
    if (sc && insts.length) {
      const ok = objectivePossible(sc.primary, instIds);
      if (!ok) add('primary', 'science', 'fail', 'Primary objective impossible',
        `No instrument can "${sc.primary.text}".`, sc.primary.why);
      else add('primary', 'science', 'ok', 'Primary objective', `Payload can ${sc.primary.text.toLowerCase()}.`, '');
    }
    // Low TRL / experimental
    if (comms && comms.risky) add('trl', 'flightops', 'warn', 'Experimental technology', 'Laser comms are still being proven: expect occasional outages.', 'Technology Readiness Level (TRL) measures how proven a technology is (1 = idea, 9 = flown many times).');

    const order = { block: 0, fail: 1, warn: 2, ok: 3 };
    checks.sort((a, b) => order[a.status] - order[b.status]);

    const roleGoals = {
      director: reserve >= 0.1 * budget,
      science: sciencePotential >= 1,
      engineer: powerMargin >= 0.2 && massMargin >= 0.15,
      flightops: dataRatio >= 1.5 && (!orbit || !orbit.dvDispose || dvCap >= dvNeedFull),
    };

    return {
      scenario: sc, diff, orbit, bus, years, risk, insts, missing,
      power: { load, required, availBOL, availEOL, margin: powerMargin, parts, eclipse, solarFactor },
      battery: { need: batteryNeed, have: batteryWh, dod },
      mass: { dry: dryMass, prop: propMass, wet: wetMass, cap: lvCap, margin: massMargin, instMass, payloadCap: bus ? bus.payloadMass : 0 },
      dv: { need: dvNeedFull, cap: dvCap },
      data: { gen: dataGen, down: dataDown, ratio: dataRatio, rate, hours },
      pointing: { need: pointNeed, have: pointHave },
      cost: { parts: cost, hardware, integration, riskPremium, development, launch, operations, opsYear, total, budget, reserve },
      science: { perInst: instScience, raw: rawScience, orbitFit, dataFactor, powerFactor, perYear: sciencePerYear, potential: sciencePotential },
      checks,
      blocks: checks.filter(c => c.status === 'block'),
      fails: checks.filter(c => c.status === 'fail'),
      warns: checks.filter(c => c.status === 'warn'),
      roleGoals,
    };
  }

  function objectivePossible(obj, instIds) {
    if (obj.allOf) return obj.allOf.every(i => instIds.includes(i));
    return obj.anyOf.some(i => instIds.includes(i));
  }

  const FIELD_LABEL = {
    orbit: 'orbit', ground: 'ground stations', comms: 'radio', bus: 'spacecraft bus', power: 'power source', battery: 'battery',
    adcs: 'attitude control', computer: 'flight computer', propulsion: 'propulsion', thermal: 'thermal control', launcher: 'launch vehicle',
    instruments: 'instruments',
  };

  // ======================================================================
  //  RANDOM NUMBERS
  // ======================================================================
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ======================================================================
  //  SIMULATION
  // ======================================================================
  function createSim(d, seed) {
    const m = analyze(d);
    const r = rng(seed || (Date.now() & 0xffffffff));
    const diff = m.diff;
    const lv = get.launcher(d.launcher), pw = get.power(d.power), prop = get.propulsion(d.propulsion);
    const totalMonths = Math.round(m.years * 12);
    const sc = m.scenario;

    // effective operating life limited by station-keeping fuel
    let lifeMonths = totalMonths;
    if (m.orbit && m.orbit.stationKeepLimitsLife && m.orbit.dvYear > 0) {
      const dvForOps = m.dv.cap - m.orbit.dvInsert;
      const yearsFuel = Math.max(0, dvForOps / m.orbit.dvYear);
      lifeMonths = Math.min(totalMonths, Math.floor(yearsFuel * 12));
    }

    // hazard per month
    let hazard = 0.0012 * m.risk.hazMult * diff.hazardMult;
    const comp = get.computer(d.computer), therm = get.thermal(d.thermal);
    if (comp && m.orbit && comp.radTol < m.orbit.radiation) hazard += 0.006 * (m.orbit.radiation - comp.radTol) * diff.hazardMult;
    if (therm && m.orbit && therm.level < m.orbit.thermal) hazard += 0.006 * diff.hazardMult;
    if (m.battery.have < m.battery.need) hazard += 0.02 * diff.hazardMult;
    if (get.comms(d.comms) && get.comms(d.comms).risky) hazard += 0.002;

    const ctx = {
      d, m, sc, r, health: 1, lostMonths: 0, bonus: 0, opsFactor: 1, reserve: Math.max(0, m.cost.reserve), dvUsed: 0,
      cutCost: () => 0.2 * m.cost.opsYear * Math.max(0, (totalMonths - ctx.month) / 12),
      month: 0,
    };

    // pick decision events
    const nEvents = Math.min(diff.events, Math.max(1, Math.floor(totalMonths / 6)));
    const pool = EVENTS.filter(e => e.when(ctx));
    const picked = [];
    const poolCopy = pool.slice();
    while (picked.length < nEvents && poolCopy.length) picked.push(poolCopy.splice(Math.floor(r() * poolCopy.length), 1)[0]);
    const eventMonths = picked.map((e, i) => Math.max(1, Math.round(((i + 1) / (picked.length + 1)) * Math.min(totalMonths, Math.max(lifeMonths, 2)))));

    const sim = {
      ctx, m, totalMonths, lifeMonths, phase: 'prelaunch', log: [], done: false, outcome: null,
      science: 0, scienceMax: m.science.perYear * m.years, extendedMonths: 0, transitDays: m.orbit ? m.orbit.transitDays * (prop && prop.slow ? 3 : 1) : 0,
      pendingEvent: null, events: picked.map((e, i) => ({ event: e, month: eventMonths[i], done: false })),
      lost: false, lostReason: '', insertionFailed: false, decisions: [],
    };
    const log = (t, kind = 'info') => sim.log.push({ t, kind, month: ctx.month });

    sim.step = function () {
      if (sim.done || sim.pendingEvent) return;
      switch (sim.phase) {
        case 'prelaunch':
          log(`T-0: ${lv.name} lifts off carrying ${Math.round(m.mass.wet)} kg.`, 'phase');
          sim.phase = 'launch'; return;
        case 'launch': {
          let rel = lv.reliability; if (diff.launchSafe) rel = 1;
          if (r() > rel) { sim.lost = true; sim.lostReason = 'Launch vehicle failure'; log('Launch failure! The rocket did not reach orbit.', 'bad'); return sim.finish(); }
          log('Nominal ascent. Spacecraft separated from the rocket.', 'good');
          sim.phase = 'deploy'; return;
        }
        case 'deploy': {
          const hasDeploy = pw && pw.type === 'solar' && pw.tier > 0;
          const p = (hasDeploy ? 0.015 : 0.003) * m.risk.hazMult * diff.hazardMult;
          if (r() < p) { ctx.health -= 0.35; log('A solar panel only partially deployed! Power permanently reduced.', 'bad'); }
          else log(hasDeploy ? 'Solar arrays and antennas deployed. Power positive!' : 'Systems checked out. Power positive!', 'good');
          sim.phase = sim.transitDays > 3 ? 'cruise' : 'ops';
          if (sim.phase === 'ops') log(`Arrived in ${m.orbit.name}. Science operations begin.`, 'phase');
          return;
        }
        case 'cruise': {
          log(`Cruise: ${Math.round(sim.transitDays)} days to ${m.orbit.name}.`, 'phase');
          if (m.orbit.dvInsert > 0) sim.phase = 'insertion'; else { sim.phase = 'ops'; log(`Arrived at ${m.orbit.name}. Science operations begin.`, 'phase'); }
          return;
        }
        case 'insertion': {
          if (m.dv.cap < m.orbit.dvInsert) {
            sim.insertionFailed = true; sim.lost = true; sim.lostReason = 'Not enough propellant for orbit insertion';
            sim.science += m.science.perYear * 0.03; // quick flyby snapshots
            log(`Insertion burn needs ${m.orbit.dvInsert} m/s but only ${Math.round(m.dv.cap)} m/s available. The spacecraft flew past ${m.scenario.body === 'Mars' ? 'Mars' : 'the Moon'}.`, 'bad');
            return sim.finish();
          }
          if (r() < 0.01 * m.risk.hazMult * diff.hazardMult) { sim.lost = true; sim.lostReason = 'Engine anomaly during orbit insertion'; log('Engine anomaly during the capture burn — contact lost.', 'bad'); return sim.finish(); }
          log(`Orbit insertion burn: ${m.orbit.dvInsert} m/s. Captured into orbit!`, 'good');
          log('Science operations begin.', 'phase');
          sim.phase = 'ops'; return;
        }
        case 'ops': {
          const limit = sim.extendedMonths ? totalMonths + sim.extendedMonths : lifeMonths;
          if (ctx.month >= limit || ctx.health <= 0) return sim.endOps();
          // scheduled decision event
          const ev = sim.events.find(e => !e.done && e.month <= ctx.month + 1);
          if (ev) { ev.done = true; sim.pendingEvent = ev.event; return; }
          ctx.month++;
          // science this month
          const perMonth = m.science.perYear / 12;
          const dvShort = !m.orbit.stationKeepLimitsLife && m.dv.cap < m.orbit.dvInsert + m.orbit.dvYear * m.years ? 0.9 : 1;
          sim.science += perMonth * Math.max(0, ctx.health) * ctx.opsFactor * dvShort;
          // random failure
          if (r() < hazard) {
            const fatal = r() < (m.risk.redundancy ? 0.1 : 0.3);
            const sys = ['power system', 'flight computer', 'star tracker', 'transponder', 'heater circuit', 'instrument electronics'][Math.floor(r() * 6)];
            if (fatal) { ctx.health = 0; log(`Month ${ctx.month}: critical failure in the ${sys}. Contact lost.`, 'bad'); sim.lost = true; sim.lostReason = `Failure of the ${sys}`; return sim.endOps(); }
            const hit = m.risk.redundancy ? 0.05 : 0.15;
            ctx.health -= hit;
            log(`Month ${ctx.month}: ${sys} fault. ${m.risk.redundancy ? 'Switched to backup unit.' : 'Operating in degraded mode.'}`, 'warn');
          }
          if (ctx.month % 12 === 0) log(`Year ${ctx.month / 12} complete. Health ${Math.round(Math.max(0, ctx.health) * 100)}%.`, 'info');
          return;
        }
        case 'extend?': return;
      }
    };

    sim.resolve = function (choiceIdx) {
      const ev = sim.pendingEvent; if (!ev) return;
      const ch = ev.choices[choiceIdx];
      const result = ch.apply(ctx);
      sim.decisions.push({ event: ev.title, choice: ch.label, result });
      log(`${ev.icon} ${ev.title} → ${ch.label}. ${result}`, ctx.health <= 0 ? 'bad' : 'event');
      sim.pendingEvent = null;
      if (ctx.health <= 0) { sim.lost = true; sim.lostReason = ev.title; sim.endOps(); }
    };

    sim.endOps = function () {
      if (ctx.health > 0 && ctx.month < totalMonths && lifeMonths < totalMonths && ctx.month >= lifeMonths && !sim.extendedMonths) {
        log(`Station-keeping propellant exhausted after ${Math.round(ctx.month)} months. Mission ended early.`, 'bad');
      }
      // extension offer
      if (ctx.health > 0.5 && !sim.extendedMonths && ctx.month >= totalMonths && !sim.lost) {
        const dvLeft = m.dv.cap - m.orbit.dvInsert - m.orbit.dvYear * m.years - m.orbit.dvDispose;
        const canFuel = !m.orbit.stationKeepLimitsLife || dvLeft >= m.orbit.dvYear;
        sim.extensionOffer = { cost: m.cost.opsYear, canFuel, canPay: ctx.reserve >= m.cost.opsYear };
        sim.phase = 'extend?';
        return;
      }
      sim.finish();
    };

    sim.extend = function (yes) {
      if (yes && sim.extensionOffer && sim.extensionOffer.canFuel && sim.extensionOffer.canPay) {
        ctx.reserve -= sim.extensionOffer.cost;
        sim.extendedMonths = 12; sim.phase = 'ops';
        log(`Extended mission approved (+1 year, $${round(sim.extensionOffer.cost)}M from reserve).`, 'good');
        sim.extensionOffer = null;
      } else { sim.extensionOffer = null; sim.finish(); }
    };

    sim.finish = function () {
      if (sim.done) return;
      sim.done = true;
      sim.science -= (m.science.perYear / 12) * ctx.lostMonths;
      sim.science = Math.max(0, sim.science) * (1 + ctx.bonus);
      // disposal
      sim.disposed = !m.orbit || !m.orbit.dvDispose || (m.dv.cap - ctx.dvUsed >= m.dv.need && !sim.lost);
      if (m.orbit && m.orbit.dvDispose && !sim.lost) log(sim.disposed ? 'End of life: disposal burn completed — orbit left clean.' : 'End of life: no fuel to dispose — the spacecraft remains as space debris.', sim.disposed ? 'good' : 'warn');
      if (m.orbit && m.orbit.id === 'leo' && !sim.lost) log('End of life: atmospheric drag will bring the spacecraft down naturally within a few years.', 'good');
      sim.outcome = score(d, m, sim);
      log('Mission complete.', 'phase');
    };

    return sim;
  }

  // ======================================================================
  //  SCORING
  // ======================================================================
  function score(d, m, sim) {
    const sc = m.scenario;
    const sciPct = sc ? sim.science / (sc.sciTarget * m.years) : 0;
    const instIds = m.insts.map(i => i.id);
    const opMonths = sim.ctx.month;
    const minOps = Math.max(3, sim.totalMonths * 0.25);
    const operatedEnough = !sim.insertionFailed && opMonths >= minOps;
    const instWorks = id => { const s = m.science.perInst.find(x => x.id === id); return s && s.factor > 0.2 && s.fit > 0; };
    const objMet = o => operatedEnough && m.data.ratio > 0.2 && (o.allOf ? o.allOf.every(i => instIds.includes(i) && instWorks(i)) : o.anyOf.some(i => instIds.includes(i) && instWorks(i)));
    const primary = sc ? objMet(sc.primary) : false;
    const secondary = sc ? sc.secondary.map(o => ({ text: o.text, met: objMet(o) })) : [];

    const sciencePts = Math.round(500 * Math.min(1.3, sciPct));
    const primaryPts = primary ? 200 : 0;
    const secondaryPts = secondary.filter(s => s.met).length * 75;
    const reserveFrac = Math.max(0, sim.ctx.reserve) / m.cost.budget;
    const efficiencyPts = sc && !sc.sandbox ? Math.round(Math.min(100, reserveFrac * 400)) : 0;
    const needsDisposal = m.orbit && m.orbit.dvDispose > 0;
    const sustainPts = needsDisposal ? (sim.disposed ? 50 : -50) : (sim.lost ? 0 : 50);
    const overridePts = -50 * m.fails.length;

    const fullLife = sim.ctx.month >= sim.totalMonths;
    let outcome;
    if (sim.lost && opMonths < minOps) outcome = 'failure';
    else if (primary && fullLife && sciPct >= 0.75) outcome = 'success';
    else if (primary || sciPct >= 0.3) outcome = 'partial';
    else outcome = 'failure';

    const goals = {
      director: reserveFrac >= 0.1 && outcome === 'success',
      science: sciPct >= 1,
      engineer: m.power.margin >= 0.2 && m.mass.margin >= 0.15,
      flightops: m.data.ratio >= 1.5 && (needsDisposal ? sim.disposed : true),
    };
    const goalPts = Object.values(goals).filter(Boolean).length * 40;
    const total = Math.max(0, sciencePts + primaryPts + secondaryPts + efficiencyPts + sustainPts + overridePts + goalPts);
    const stars = total >= 1100 ? 3 : total >= 800 ? 2 : total >= 450 ? 1 : 0;

    return { sciPct, sciencePts, primary, primaryPts, secondary, secondaryPts, efficiencyPts, reserveFrac, sustainPts, overridePts,
      goals, goalPts, total, stars, outcome, opMonths, fullLife };
  }

  // ======================================================================
  //  DESIGN CODES (share / compare)
  // ======================================================================
  function encode(d) {
    const keys = ['scenario','difficulty','years','risk','orbit','ground','comms','instruments','bus','power','battery','adcs','computer','propulsion','thermal','launcher'];
    const arr = keys.map(k => d[k]);
    const json = JSON.stringify(arr);
    const b64 = typeof btoa === 'function' ? btoa(unescape(encodeURIComponent(json))) : Buffer.from(json).toString('base64');
    return 'MA1-' + b64;
  }
  function decode(code) {
    try {
      const s = code.trim().replace(/^MA1-/, '');
      const json = typeof atob === 'function' ? decodeURIComponent(escape(atob(s))) : Buffer.from(s, 'base64').toString();
      const arr = JSON.parse(json);
      const keys = ['scenario','difficulty','years','risk','orbit','ground','comms','instruments','bus','power','battery','adcs','computer','propulsion','thermal','launcher'];
      const d = {}; keys.forEach((k, i) => d[k] = arr[i]);
      if (!get.scenario(d.scenario)) return null;
      if (!Array.isArray(d.instruments)) d.instruments = [];
      return d;
    } catch (e) { return null; }
  }

  return { ROLES, ROLE_ORDER, DIFFICULTY, RISK, ORBITS, LAUNCHERS, BUSES, POWER, BATTERIES, COMMS, GROUND, ADCS, COMPUTERS,
    PROPULSION, THERMAL, INSTRUMENTS, SCENARIOS, EVENTS, FIELD_ROLE, FIELD_LABEL, REQUIRED_FIELDS,
    get, newDesign, analyze, createSim, score, rng, encode, decode, round, objectivePossible };
})();
if (typeof module !== 'undefined') module.exports = GAME;

<script>/* ==========================================================================
   MISSION ARCHITECT — SVG visuals (spacecraft builder + orbit diagrams)
   ========================================================================== */
const VIS = (() => {
  const G = GAME;

  function panel(x, y, w, h) {
    let cells = '';
    const cw = w / Math.max(1, Math.round(w / 8)), ch = h / Math.max(1, Math.round(h / 8));
    for (let cx = x + cw; cx < x + w - 0.5; cx += cw) cells += `<line x1="${cx}" y1="${y}" x2="${cx}" y2="${y + h}"/>`;
    for (let cy = y + ch; cy < y + h - 0.5; cy += ch) cells += `<line x1="${x}" y1="${cy}" x2="${x + w}" y2="${cy}"/>`;
    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="url(#cell)" stroke="#8fb3ff" stroke-width="0.8"/><g stroke="#24407a" stroke-width="0.5">${cells}</g></g>`;
  }

  function craft(d) {
    const bus = G.get.bus(d.bus) ? d.bus : null;
    const size = { cube: [34, 34], small: [58, 52], medium: [82, 72], large: [104, 88] }[bus || 'small'];
    const [bw, bh] = size; const cx = 160, cy = 108;
    const bx = cx - bw / 2, by = cy - bh / 2;
    const pw = G.get.power(d.power);
    const comms = d.comms, insts = d.instruments || [];
    const therm = d.thermal, prop = d.propulsion, adcs = d.adcs;
    let back = '', front = '', top = '', bottom = '';

    // sunshield (cryo) behind & below
    if (therm === 'cryo') {
      for (let i = 0; i < 5; i++) {
        const o = i * 4;
        back += `<polygon points="${cx - 120 + o},${cy + bh / 2 + 20 - i * 2} ${cx},${cy + bh / 2 + 4 - i * 2} ${cx + 120 - o},${cy + bh / 2 + 20 - i * 2} ${cx},${cy + bh / 2 + 36 - i * 2}" fill="${['#b9a3ff', '#c9b6ff', '#d8c9ff', '#e6dbff', '#f3edff'][i]}" opacity="${0.55 + i * 0.08}" stroke="#7d6bd6" stroke-width="0.5"/>`;
      }
    }

    // solar arrays
    if (pw && pw.type === 'solar' && pw.tier > 0) {
      const spec = { 1: [1, 34, 26], 2: [2, 30, 36], 3: [3, 30, 48], 4: [2, 48, 50] }[Math.min(4, pw.tier)];
      const [n, w, h] = spec;
      const gap = 3, boom = 8;
      for (const side of [-1, 1]) {
        const startX = side < 0 ? bx - boom : bx + bw + boom;
        back += `<line x1="${side < 0 ? bx : bx + bw}" y1="${cy}" x2="${startX}" y2="${cy}" stroke="#c9d1e0" stroke-width="2"/>`;
        for (let i = 0; i < n; i++) {
          const x = side < 0 ? startX - (i + 1) * w - i * gap : startX + i * (w + gap);
          back += panel(x, cy - h / 2, w, h);
          if (pw.id === 'huge') back += `<rect x="${side < 0 ? x - 3 : x + w}" y="${cy - h / 2}" width="3" height="${h}" fill="#9aa6bd"/>`;
        }
      }
    }
    // RTG
    if (pw && pw.type === 'rtg') {
      const rx = bx - 26, ry = cy + bh / 2 - 6;
      back += `<line x1="${bx}" y1="${cy + bh / 2 - 10}" x2="${rx + 10}" y2="${ry + 4}" stroke="#c9d1e0" stroke-width="2"/>`;
      back += `<g transform="rotate(-35 ${rx} ${ry})"><rect x="${rx - 7}" y="${ry - 16}" width="14" height="32" rx="3" fill="#59606e" stroke="#9aa6bd"/>` +
        [...Array(6)].map((_, i) => `<rect x="${rx - 12}" y="${ry - 14 + i * 5.5}" width="24" height="1.6" fill="#7b8496"/>`).join('') + `<circle cx="${rx}" cy="${ry}" r="3" fill="#ff7a3d" opacity=".8"><animate attributeName="opacity" values=".4;.9;.4" dur="2s" repeatCount="indefinite"/></circle></g>`;
    }

    // IR telescope primary mirror above
    const hasTel = insts.includes('ir_tel');
    if (hasTel) {
      const hx = (q, r) => { const s = 9; return [cx + s * 1.5 * q, cy - bh / 2 - 46 + s * Math.sqrt(3) * (r + q / 2)]; };
      const cells = [[0, 0], [1, -1], [1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [2, -1], [-2, 1], [2, -2], [-2, 2], [1, 1], [-1, -1], [2, 0], [-2, 0]];
      let mirr = '';
      cells.forEach(([q, r]) => {
        if (q === 0 && r === 0) return;
        const [x, y] = hx(q, r); const pts = [...Array(6)].map((_, k) => { const a = Math.PI / 3 * k; return `${x + 8.6 * Math.cos(a)},${y + 8.6 * Math.sin(a)}`; }).join(' ');
        mirr += `<polygon points="${pts}" fill="url(#gold)" stroke="#8a6a1f" stroke-width="0.6"/>`;
      });
      top += `<line x1="${cx}" y1="${by}" x2="${cx}" y2="${cy - bh / 2 - 30}" stroke="#c9d1e0" stroke-width="3"/>${mirr}<circle cx="${cx}" cy="${cy - bh / 2 - 74}" r="3" fill="#ddd"/><line x1="${cx - 30}" y1="${cy - bh / 2 - 40}" x2="${cx}" y2="${cy - bh / 2 - 74}" stroke="#aab" stroke-width="0.8"/><line x1="${cx + 30}" y1="${cy - bh / 2 - 40}" x2="${cx}" y2="${cy - bh / 2 - 74}" stroke="#aab" stroke-width="0.8"/>`;
    }

    // bus body
    const isCube = bus === 'cube';
    const fill = isCube ? 'url(#alu)' : 'url(#gold)';
    let busSvg = `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="${fill}" stroke="${isCube ? '#9aa6bd' : '#8a6a1f'}" stroke-width="1.2"/>`;
    if (!isCube) busSvg += `<path d="M${bx + 4} ${by + 6} q ${bw / 3} 6 ${bw - 8} -2 M${bx + 4} ${by + bh - 10} q ${bw / 2} -8 ${bw - 8} 3" stroke="#f6dc8c" stroke-width="0.8" fill="none" opacity=".7"/>`;
    if (isCube) for (let i = 1; i < 3; i++) busSvg += `<line x1="${bx}" y1="${by + i * bh / 3}" x2="${bx + bw}" y2="${by + i * bh / 3}" stroke="#7c8799" stroke-width="0.6"/>`;
    if (pw && pw.id === 'body') { busSvg += panel(bx + 3, by + 3, bw - 6, bh * 0.45); }

    // instruments on the front face
    const colors = ['#5ce1e6', '#ff8f6b', '#9b8cff', '#7ee787', '#ffd166', '#ff6bcb'];
    const shown = insts.filter(i => i !== 'ir_tel');
    shown.forEach((id, i) => {
      const cols = Math.min(3, shown.length), rows = Math.ceil(shown.length / 3);
      const w = Math.min(22, (bw - 10) / cols - 3), h = Math.min(16, (bh * 0.45) / rows - 2);
      const col = i % 3, row = Math.floor(i / 3);
      const x = bx + 5 + col * (w + 3), y = by + bh - 6 - (rows - row) * (h + 2);
      const label = G.get.inst(id).name.split(/[\s-]+/).map(s => s[0]).join('').slice(0, 2).toUpperCase();
      busSvg += `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#141b2d" stroke="${colors[i % 6]}" stroke-width="1.2"/><circle cx="${x + w / 2}" cy="${y + h / 2 - 1}" r="${Math.min(w, h) / 4}" fill="${colors[i % 6]}" opacity=".35"/><text x="${x + w / 2}" y="${y + h / 2 + 2.5}" font-size="6.5" text-anchor="middle" fill="${colors[i % 6]}" font-family="monospace">${label}</text></g>`;
    });

    // comms hardware on top
    const topY = by;
    if (comms === 'uhf') top += `<line x1="${bx + 4}" y1="${topY}" x2="${bx - 14}" y2="${topY - 22}" stroke="#ddd" stroke-width="1"/><line x1="${bx + bw - 4}" y1="${topY}" x2="${bx + bw + 14}" y2="${topY - 22}" stroke="#ddd" stroke-width="1"/>`;
    if (comms === 'sband') top += `<rect x="${cx + bw / 4 - 6}" y="${topY - 6}" width="12" height="6" fill="#d9dee8"/><line x1="${cx + bw / 4}" y1="${topY - 6}" x2="${cx + bw / 4}" y2="${topY - 18}" stroke="#ddd" stroke-width="1.4"/>`;
    const dish = (r, col) => `<line x1="${cx + (hasTel ? bw / 3 : 0)}" y1="${topY}" x2="${cx + (hasTel ? bw / 3 : 0)}" y2="${topY - 10}" stroke="#c9d1e0" stroke-width="2"/><ellipse cx="${cx + (hasTel ? bw / 3 : 0)}" cy="${topY - 10 - r * 0.35}" rx="${r}" ry="${r * 0.35}" fill="${col}" stroke="#7d8799"/><line x1="${cx + (hasTel ? bw / 3 : 0)}" y1="${topY - 10 - r * 0.35}" x2="${cx + (hasTel ? bw / 3 : 0)}" y2="${topY - 14 - r * 0.8}" stroke="#aab" stroke-width="1"/>`;
    if (comms === 'xband') top += dish(10, '#eef1f6');
    if (comms === 'hga') top += dish(28, '#f4f6fa');
    if (comms === 'ka') top += dish(18, '#ffe7a3');
    if (comms === 'laser') top += `<rect x="${cx - 5}" y="${topY - 16}" width="10" height="16" rx="2" fill="#3a4258" stroke="#9aa6bd"/><circle cx="${cx}" cy="${topY - 16}" r="4" fill="#7ee787"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>`;

    // star trackers
    if (adcs === 'star' || adcs === 'fine') top += `<rect x="${bx + bw - 10}" y="${by - 7}" width="6" height="8" fill="#222a3d" stroke="#9aa6bd"/><rect x="${bx + 4}" y="${by - 7}" width="6" height="8" fill="#222a3d" stroke="#9aa6bd"/>`;
    if (insts.includes('magnetometer')) top += `<line x1="${bx + bw}" y1="${by + 8}" x2="${bx + bw + 36}" y2="${by - 18}" stroke="#c9d1e0" stroke-width="1.2"/><circle cx="${bx + bw + 36}" cy="${by - 18}" r="2.5" fill="#ffd166"/>`;

    // propulsion
    if (prop && prop !== 'none') {
      const nw = { cold: 6, mono: 10, biprop: 16, ion: 14 }[prop] || 8;
      bottom += `<polygon points="${cx - nw / 3},${by + bh} ${cx + nw / 3},${by + bh} ${cx + nw / 2},${by + bh + nw * 0.9} ${cx - nw / 2},${by + bh + nw * 0.9}" fill="#4b5366" stroke="#9aa6bd"/>`;
      if (prop === 'ion') bottom += `<ellipse cx="${cx}" cy="${by + bh + nw + 6}" rx="5" ry="10" fill="#6fb7ff" opacity=".55"><animate attributeName="opacity" values=".2;.7;.2" dur="1.2s" repeatCount="indefinite"/></ellipse>`;
    }

    const empty = !bus;
    return `<svg viewBox="0 0 320 220" class="craft" role="img" aria-label="Spacecraft preview">
      <defs>
        <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset=".5" stop-color="#d4a843"/><stop offset="1" stop-color="#a77d26"/></linearGradient>
        <linearGradient id="alu" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e8ecf3"/><stop offset="1" stop-color="#9aa3b5"/></linearGradient>
        <linearGradient id="cell" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2a4fa8"/><stop offset="1" stop-color="#16295e"/></linearGradient>
      </defs>
      <g class="${empty ? 'craft-empty' : 'float'}">${back}${busSvg}${top}${bottom}${front}</g>
      ${empty ? '<text x="160" y="200" text-anchor="middle" fill="#7f8aa3" font-size="11">Choose a bus to start building</text>' : ''}
    </svg>`;
  }

  // ---------------- orbit diagrams ----------------
  function orbit(id, opts = {}) {
    const w = 320, h = 180, big = opts.big;
    const dot = (path, dur) => `<circle r="${big ? 4 : 3.2}" fill="#ffd166" stroke="#fff" stroke-width="1"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${path}"/></circle>`;
    const stars = [...Array(40)].map((_, i) => `<circle cx="${(i * 73) % w}" cy="${(i * 41) % h}" r="${i % 5 === 0 ? 1 : 0.5}" fill="#fff" opacity="${0.2 + (i % 4) * 0.15}"/>`).join('');
    const earth = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#earthg)"/><path d="M${x - r * 0.5} ${y - r * 0.3} q ${r * 0.3} -${r * 0.4} ${r * 0.6} 0 t ${r * 0.4} ${r * 0.5}" stroke="#7ee787" stroke-width="${r / 6}" fill="none" opacity=".6"/>`;
    const defs = `<defs><radialGradient id="earthg" cx=".35" cy=".35"><stop offset="0" stop-color="#6fb7ff"/><stop offset="1" stop-color="#1b4fa0"/></radialGradient>
      <radialGradient id="sung" cx=".5" cy=".5"><stop offset="0" stop-color="#fff6c2"/><stop offset=".6" stop-color="#ffc247"/><stop offset="1" stop-color="#ff8a00" stop-opacity="0"/></radialGradient>
      <radialGradient id="moong" cx=".35" cy=".35"><stop offset="0" stop-color="#e6e6e6"/><stop offset="1" stop-color="#8d8d8d"/></radialGradient>
      <radialGradient id="marsg" cx=".35" cy=".35"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#a8381a"/></radialGradient></defs>`;
    let body = '';
    const label = (x, y, t, a = 'middle') => `<text x="${x}" y="${y}" fill="#aab4c8" font-size="10" text-anchor="${a}">${t}</text>`;
    switch (id) {
      case 'leo': { const p = 'M110,90 a50,50 0 1,0 100,0 a50,50 0 1,0 -100,0'; body = `${earth(160, 90, 40)}<path d="${p}" stroke="#ffd166" stroke-dasharray="3 3" fill="none" opacity=".7"/>${dot(p, 4)}${label(160, 170, 'LEO · 500 km · 95 min orbit')}`; break; }
      case 'sso': { const p = 'M160,30 a24,60 0 1,0 0.1,0'; body = `${earth(160, 90, 40)}<path d="M160,30 a24,60 0 1,0 0.1,0" stroke="#ffd166" stroke-dasharray="3 3" fill="none" opacity=".7" transform="rotate(8 160 90)"/><g transform="rotate(8 160 90)">${dot(p, 4)}</g>${label(160, 170, 'Sun-synchronous · near-polar · 700 km')}`; break; }
      case 'geo': { const p = 'M70,90 a90,70 0 1,0 180,0 a90,70 0 1,0 -180,0'; body = `${earth(160, 90, 22)}<path d="${p}" stroke="#ffd166" stroke-dasharray="3 3" fill="none" opacity=".7"/>${dot(p, 12)}${label(160, 172, 'GEO · 35,786 km · 24 h orbit')}`; break; }
      case 'l1': case 'l2': {
        const lx = id === 'l1' ? 200 : 290;
        body = `<circle cx="20" cy="90" r="34" fill="url(#sung)"/>${label(20, 145, 'Sun')}${earth(250, 90, 9)}${label(250, 115, 'Earth')}
          <circle cx="200" cy="90" r="2" fill="#aab4c8"/>${label(200, 70, 'L1')}<circle cx="290" cy="90" r="2" fill="#aab4c8"/>${label(290, 70, 'L2')}
          <line x1="40" y1="90" x2="300" y2="90" stroke="#34405a" stroke-dasharray="2 4"/>
          <ellipse cx="${lx}" cy="90" rx="7" ry="16" stroke="#ffd166" stroke-dasharray="2 2" fill="none" opacity=".8"/>
          ${dot(`M${lx},74 a7,16 0 1,0 0.1,0`, 6)}${label(160, 170, id === 'l1' ? 'L1 · 1.5 million km toward the Sun' : 'L2 · 1.5 million km away from the Sun')}`; break; }
      case 'moon': { const p = 'M240,52 a22,38 0 1,0 0.1,0'; body = `${earth(50, 90, 18)}${label(50, 125, 'Earth')}<path d="M68,90 C120,40 190,40 222,80" stroke="#34405a" stroke-dasharray="3 4" fill="none"/><circle cx="240" cy="90" r="30" fill="url(#moong)"/><circle cx="232" cy="78" r="4" fill="#7a7a7a" opacity=".6"/><circle cx="250" cy="100" r="6" fill="#7a7a7a" opacity=".5"/><path d="${p}" stroke="#ffd166" stroke-dasharray="3 3" fill="none" opacity=".8"/>${dot(p, 4)}${label(160, 170, 'Polar lunar orbit · over both poles')}`; break; }
      case 'mars': { const p = 'M248,58 a34,34 0 1,0 0.1,0'; body = `<circle cx="40" cy="160" r="20" fill="url(#sung)"/>${earth(70, 40, 9)}${label(70, 25, 'Earth')}<path d="M78,44 C160,20 220,40 222,70" stroke="#34405a" stroke-dasharray="3 4" fill="none"/>${label(150, 40, '7-month cruise')}<circle cx="248" cy="92" r="26" fill="url(#marsg)"/><path d="${p}" stroke="#ffd166" stroke-dasharray="3 3" fill="none" opacity=".8"/>${dot(p, 4)}${label(248, 145, 'Mars orbit')}`; break; }
      default: body = `${label(160, 95, 'Choose an orbit')}`;
    }
    return `<svg viewBox="0 0 ${w} ${h}" class="orbitsvg">${defs}${stars}${body}</svg>`;
  }

  function rocket() {
    return `<svg viewBox="0 0 120 220" class="rocket"><g class="rocket-body"><path d="M60 10 C72 30 76 60 76 120 L44 120 C44 60 48 30 60 10Z" fill="#e8ecf3" stroke="#9aa6bd"/><circle cx="60" cy="60" r="7" fill="#1b4fa0" stroke="#9aa6bd"/><path d="M44 100 L30 132 L44 124Z M76 100 L90 132 L76 124Z" fill="#c43c3c"/><rect x="50" y="120" width="20" height="8" fill="#59606e"/><path d="M50 128 Q60 190 70 128Z" fill="#ffb547"><animate attributeName="d" values="M50 128 Q60 190 70 128Z;M50 128 Q60 210 70 128Z;M50 128 Q60 190 70 128Z" dur=".25s" repeatCount="indefinite"/></path><path d="M54 128 Q60 165 66 128Z" fill="#fff6c2"/></g></svg>`;
  }

  return { craft, orbit, rocket };
})();
</script>
<script>/* ==========================================================================

(() => {
  const G = GAME, V = VIS;

  const S = {
    screen: 'home', nPlayers: 1, players: ['Player 1', 'Player 2', 'Player 3', 'Player 4'], team: 'Team Apollo',

  };

  // ---------- helpers ----------

      </div>
